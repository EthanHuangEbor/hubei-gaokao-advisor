[project]
name = "hubei-gaokao-advisor"
version = "0.1.0"
description = "湖北高考院校专业组志愿冲稳保垫推荐 MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pymupdf>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = [".agents/skills/nuwa-skill", "node_modules", ".next"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/import_hubei_fixtures.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
strict_optional = true
ignore_missing_imports = true
exclude = ["apps/web"]
explicit_package_bases = true

